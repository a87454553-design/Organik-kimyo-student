<script>
const data=[
{g:"I. Asoslar",t:"Organik kimyoga kirish",d:1,intro:"Organik kimyo uglerod birikmalarining tuzilishi, xossalari, sintezi va reaksiyalarini o‘rganadi. Uglerodning to‘rt valentliligi, C–C bog‘lar hosil qilishi va zanjir/halqa tuzishi juda ko‘p birikmalar mavjudligini tushuntiradi.",s:[["Bog‘lanish","Oddiy bog‘ σ-bog‘dan; qo‘sh bog‘ bir σ va bir π-bog‘dan; uch bog‘ bir σ va ikki π-bog‘dan tashkil topadi. σ-bog‘ o‘q bo‘ylab, π-bog‘ yonlama orbital qoplanishi orqali hosil bo‘ladi."],["Tuzilish va xossalar","Funksional guruh moddaning xarakterli reaksiyalariga ta’sir qiladi. Molekulyar formula atomlar sonini, strukturaviy formula esa atomlarning qanday bog‘langanini ko‘rsatadi."],["Gibridlanish","Alkan uglerodi odatda sp³ va tetraedrik; alken uglerodi sp² va tekis; alkin uglerodi sp va chiziqli geometriyaga ega."]],f:["Alkan: CₙH₂ₙ₊₂","Alken: CₙH₂ₙ (ochiq zanjir, bitta C=C)","Alkin: CₙH₂ₙ₋₂ (ochiq zanjir, bitta C≡C)"],ex:"Etan C₂H₆ da C–C oddiy bog‘i, eten C₂H₄ da C=C bog‘i bor. Etenning π-bog‘i elektronlarga boy bo‘lgani sababli qo‘shilish reaksiyalariga moyil.",tasks:["σ va π-bog‘ farqini izohlang.","C₃H₈, C₃H₆ va C₃H₄ ga mos sinf nomini yozing."],q:[["Qo‘sh bog‘ tarkibi?",["2 σ","1 σ + 1 π","1 σ + 2 π"],1,"Qo‘sh bog‘ bitta σ va bitta π bog‘dan iborat."],["Alken uglerodining odatiy gibridlanishi?",["sp³","sp²","sp"],1,"C=C uglerodlari odatda sp² gibridlangan."],["Funksional guruh nimaga ta’sir qiladi?",["Xarakterli reaksiyalarga","Faqat rangga","Faqat massaga"],0,"Funksional guruh reaktivlikning muhim belgisidir."]]},
{g:"I. Asoslar",t:"Nomenklatura",d:1,intro:"IUPAC nomenklaturasi tuzilishdan kelib chiqib birikmalarga aniq nom beradi. Asosiy zanjir, ko‘p bog‘, asosiy funksional guruh va o‘rinbosarlarning joyi tanlanadi.",s:[["Zanjirni tanlash","Muhim funksional guruh va ko‘p bog‘ni qamrab oladigan mos zanjir tanlanadi. Raqamlashda asosiy funksional guruh, so‘ng ko‘p bog‘ eng kichik lokant olishi kerak."],["O‘rinbosarlar","Metil, etil va boshqa alkil guruhlar raqam bilan ko‘rsatiladi. Bir xil guruhlar di-, tri- kabi old qo‘shimchalar bilan belgilanadi."],["Sinf qo‘shimchalari","Alkenlarda -en, alkinlarda -in, spirtlarda -ol, aldegidlarda -al, ketonlarda -on, karboksil kislotalarda -kislota ishlatiladi."]],f:["CH₃–CH₂–CH₃ — propan","CH₂=CH–CH₃ — propen","CH₃–CH(OH)–CH₃ — propan-2-ol"],ex:"CH₃–CH(CH₃)–CH₂–CH₃: asosiy zanjir 4 uglerodli, metil tarmog‘i 2-uglerodda; nomi 2-metilbutan.",tasks:["CH₃–CH₂–CH₂–CH₃ ni nomlang.","CH₃–CH=CH–CH₃ ning qo‘sh bog‘i qaysi pozitsiyada?"],q:[["CH₃–CH(CH₃)–CH₂–CH₃?",["2-metilbutan","3-metilbutan","pentan"],0,"Eng kichik raqam qoidasiga ko‘ra metil 2-pozitsiyada."],["CH₃CH₂OH qaysi sinf?",["Spirt","Keton","Kislota"],0,"Molekulada –OH guruhi bor."],["Uch bog‘ qo‘shimchasi?",["-an","-en","-in"],2,"Alkinlarda -in ishlatiladi."]]},
{g:"I. Asoslar",t:"Izomeriya va stereokimyo",d:1,intro:"Izomerlar bir xil molekulyar formulaga ega bo‘lib, atomlarning bog‘lanish tartibi yoki fazodagi joylashuvi bilan farqlanadi.",s:[["Tuzilish izomeriyasi","Uglerod skeleti, funksional guruh yoki ko‘p bog‘ning joylashuvi farq qilishi mumkin. C₄H₁₀ ning n-butan va 2-metilpropan shakllari zanjir izomerlaridir."],["Geometrik izomeriya","C=C atrofida aylanish cheklangan. Qo‘sh bog‘ning har bir uglerodida ikki xil o‘rinbosar bo‘lsa, E/Z izomeriya yuzaga kelishi mumkin."],["Optik izomeriya","To‘rtta turli guruhga bog‘langan tetraedrik uglerod stereogen markaz bo‘lishi mumkin. Ustma-ust tushmaydigan ko‘zgudagi juftlik enantiomerlar deyiladi."]],f:["C₄H₁₀: n-butan va 2-metilpropan","cis-/trans-but-2-en: geometrik izomerlar"],ex:"But-2-enda ikkala CH₃ guruhi bir tomonda bo‘lsa cis, qarama-qarshi tomonda bo‘lsa trans izomer kuzatiladi.",tasks:["C₅H₁₂ uchun uch izomer yozing.","E/Z izomeriyasi uchun qanday shart kerak?"],q:[["Izomerlar nimasi bilan bir xil?",["Molekulyar formula","Har doim tuzilishi","Har doim qaynash harorati"],0,"Izomerlarning molekulyar formulasi bir xil, tuzilishi farqli."],["C=C aylanishi nega cheklangan?",["π-bog‘ qoplanishi buziladi","C atomlari yo‘q","σ-bog‘ mavjud emas"],0,"Aylanish π-orbitallarning yonlama qoplanishini buzadi."],["Enantiomerlar qanday juftlik?",["Ustma-ust tushmaydigan ko‘zgudagi tasvirlar","Faqat zanjir izomerlari","Bir xil molekula"],0,"Enantiomerlar bir-birining ustma-ust tushmaydigan ko‘zgudagi tasviridir."]]},
{g:"I. Asoslar",t:"Elektron effektlar va kislota-asos xossalari",d:1,intro:"Organik molekuladagi elektron zichligi induktiv, rezonans/mezomer, giperkon’yugatsiya va sterik ta’sirlar orqali o‘zgaradi. Bu omillar barqarorlik, kislotalilik, asoslik va reaksiya yo‘nalishini tushuntiradi.",s:[["Induktiv effekt","Elektrmanfiy atomlar σ-bog‘lar orqali elektron zichligini tortishi mumkin (−I); ayrim alkil guruhlar esa elektron zichligini itaruvchi (+I) ta’sir ko‘rsatadi. Ta’sir masofa ortishi bilan kamayadi."],["Rezonans","Kon’yugirlangan tizimda elektron zichligi bir nechta atom bo‘ylab delokallashadi. Rezonans barqarorlashuvi, masalan, karboksilat anionida manfiy zaryadning ikki kislorod bo‘ylab taqsimlanishini tushuntiradi."],["Kislota va asos","Kislota proton beradi, asos proton qabul qiladi. Kislota kuchi uning kon’yugat asosining barqarorligiga bog‘liq; erituvchi va molekula tuzilishi ham muhim."]],f:["HA ⇌ H⁺ + A⁻","pKa = −log₁₀ Ka","pKa kichik bo‘lsa, odatda kislota kuchliroq"],ex:"Karboksilat anionidagi manfiy zaryad ikki kislorod orasida rezonans bilan taqsimlanadi; bu kon’yugat asosni barqarorlashtiradi.",tasks:["−I effektga misol keltiring.","Rezonans kislotalilikka qanday ta’sir qilishi mumkin?"],q:[["Kislota nima qiladi?",["Proton beradi","Proton qabul qiladi","Elektron doim beradi"],0,"Brønsted kislota proton donori."],["pKa kichik bo‘lsa, odatda…",["Kislota kuchliroq","Kislota kuchsizroq","Hech qanday bog‘liqlik yo‘q"],0,"pKa Ka ning manfiy logarifmi; Ka katta bo‘lsa pKa kichik."],["Karboksilat zaryadi qanday barqarorlashadi?",["Rezonans","Faqat massa","Metall bog‘i"],0,"Zaryad ikki kislorod bo‘ylab delokallashadi."]]},
{g:"II. Uglevodorodlar",t:"Alkanlar",d:1,intro:"Alkanlar faqat C–C va C–H oddiy bog‘lariga ega to‘yingan ochiq zanjirli uglevodorodlardir. Ular ko‘pincha sust, lekin yonish, radikal galogenlash, kreking va izomerlanish reaksiyalariga kirishadi.",s:[["Tuzilishi","Uglerodlar sp³ gibridlangan, geometriya tetraedrik. Molekulalararo kuchlar asosan dispersiya kuchlari bo‘lgani uchun zanjir uzayishi qaynash haroratini odatda oshiradi."],["Olinishi","Neft va tabiiy gaz muhim manbalardir. Alkenlarni gidrogenlash va ayrim karboksilat tuzlarini dekarboksillash ham laboratoriya usullariga kiradi."],["Reaksiyalar","To‘liq yonishda CO₂ va H₂O hosil bo‘ladi. Yorug‘likda galogenlash radikal zanjirli almashinishdir; yuqori haroratdagi kreking yirik uglevodorodlarni kichikroq molekulalarga ajratadi."]],f:["CₙH₂ₙ₊₂","CH₄ + 2O₂ → CO₂ + 2H₂O","CH₄ + Cl₂ —hv→ CH₃Cl + HCl"],ex:"Propan yonishi: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O. Har ikki tomondagi C, H va O atomlari soni teng.",tasks:["Butanning yonish tenglamasini tenglashtiring.","Alkanlar nima uchun bromli suvni odatda rangsizlantirmaydi?"],q:[["Alkanlarning umumiy formulasi?",["CₙH₂ₙ₊₂","CₙH₂ₙ","CₙH₂ₙ₋₂"],0,"To‘yingan ochiq zanjirli alkan formulasi CₙH₂ₙ₊₂."],["To‘liq yonish mahsulotlari?",["CO₂ va H₂O","CO va H₂","Faqat C"],0,"Kislorod yetarli bo‘lsa CO₂ va suv hosil bo‘ladi."],["Galogenlashning odatiy mexanizmi?",["Radikal zanjirli","Elektrofil qo‘shilish","Esterlanish"],0,"Yorug‘lik radikallar hosil bo‘lishini boshlashi mumkin."]]},
{g:"II. Uglevodorodlar",t:"Sikloalkanlar",d:1,intro:"Sikloalkanlar uglerod halqasi tutgan to‘yingan uglevodorodlar. Bitta halqali sikloalkanlar CₙH₂ₙ formulasiga ega; halqa geometriyasi burchak va torsion kuchlanishga ta’sir qiladi.",s:[["Halqa kuchlanishi","Siklopropanda bog‘ burchagi ideal tetraedrik burchakdan ancha kichik. Siklogeksanning kreslo konformatsiyasi nisbatan barqaror."],["Konformatsiya","Siklogeksanda aksial va ekvatorial o‘rinlar bor. Katta o‘rinbosarlar ko‘pincha ekvatorial holatni afzal ko‘radi, chunki 1,3-diaxial ta’sirlar kamayadi."],["Kimyoviy xossalar","Katta halqalar alkanlarga o‘xshab yonish va almashinish reaksiyalariga kirishadi. Kichik halqalardagi kuchlanish ayrim sharoitlarda halqa ochilishiga olib kelishi mumkin."]],f:["Sikloalkan (bitta halqa): CₙH₂ₙ","Siklogeksan: C₆H₁₂"],ex:"C₆H₁₂ siklogeksan bo‘lishi mumkin, lekin bitta qo‘sh bog‘li ochiq zanjirli alken ham shu formulaga ega. Formula o‘zi tuzilishni aniqlamaydi.",tasks:["Siklopropan va siklogeksan kuchlanishini taqqoslang.","Ekvatorial holatning afzalligini tushuntiring."],q:[["Monotsiklik sikloalkan formulasi?",["CₙH₂ₙ","CₙH₂ₙ₊₂","CₙH₂ₙ₋₂"],0,"Halqa ochiq zanjirli alkan bilan solishtirganda ikki H ga kamayadi."],["Siklogeksanning barqaror shakli?",["Kreslo","Tekis kvadrat","Chiziq"],0,"Kreslo burchak va torsion kuchlanishni kamaytiradi."],["Siklopropan reaktivligiga nima hissa qo‘shadi?",["Halqa kuchlanishi","Aromatiklik","Metall bog‘i"],0,"Kichik halqada burchak kuchlanishi katta."]]},
{g:"II. Uglevodorodlar",t:"Alkenlar",d:1,intro:"Alkenlarda C=C qo‘sh bog‘i mavjud. π-bog‘ elektronlarga boy bo‘lgani uchun alkenlar elektrofil qo‘shilish, gidrogenlash, oksidlanish va polimerlanish reaksiyalariga kirishadi.",s:[["Nomenklatura va izomeriya","Asosiy zanjir C=C ni o‘z ichiga oladi; qo‘sh bog‘ eng kichik raqam oladi. Skelet va pozitsion izomeriya, ayrim hollarda E/Z izomeriyasi uchraydi."],["Olinishi","Spirtlarni suvsizlantirish, galogenalkanlardan HX ajratish va kreking alken olish usullaridir. Harorat va reagent tanlovi mahsulot tarkibiga ta’sir qiladi."],["Qo‘shilish va polimerlanish","H₂ qo‘shilishi alkan beradi; Br₂ bilan reaksiyada vicinal dibromid hosil bo‘lishi mumkin. HX qo‘shilish yo‘nalishi substrat va sharoitga bog‘liq. Eten polimerlanib polietilen hosil qiladi."]],f:["CH₂=CH₂ + H₂ —Ni→ CH₃–CH₃","CH₂=CH₂ + Br₂ → BrCH₂–CH₂Br","n CH₂=CH₂ → (–CH₂–CH₂–)ₙ"],ex:"Propen + HBr odatiy ion sharoitida ko‘pincha 2-bromopropan beradi (Markovnikov yo‘nalishi). Peroksid ishtirokidagi radikal sharoitda HBr uchun boshqa yo‘nalish mumkin.",tasks:["But-1-en gidrogenlanishini yozing.","Eten + Br₂ reaksiyasida rang o‘zgarishini tushuntiring.","Propen + HBr mahsulotini aniqlang."],q:[["Alken uchun xarakterli reaksiya?",["Elektrofil qo‘shilish","Faqat neytrallanish","Faqat tuz hosil qilish"],0,"π-bog‘ elektrofil reagent bilan reaksiyaga kirishadi."],["Eten gidrogenlanganda?",["Etan","Etin","Etanol"],0,"H₂ qo‘shilib qo‘sh bog‘ to‘yinadi."],["Bitta qo‘sh bog‘li ochiq alken formulasi?",["CₙH₂ₙ","CₙH₂ₙ₊₂","CₙH₂ₙ₋₂"],0,"Bitta qo‘sh bog‘ vodorod sonini alkan bilan solishtirganda ikkiga kamaytiradi."]]},
{g:"II. Uglevodorodlar",t:"Alkadienlar",d:1,intro:"Alkadienlarda ikkita qo‘sh bog‘ bor. Ular ajratilgan, kumulyativ yoki kon’yugirlangan bo‘lishi mumkin; kon’yugirlangan tizimda π-elektronlar delokallashadi.",s:[["Tuzilish","Kon’yugirlangan dienlarda qo‘sh va oddiy bog‘lar almashib keladi: C=C–C=C. Kumulyativ dienlarda qo‘sh bog‘lar umumiy atomga tutashadi."],["1,2- va 1,4-qo‘shilish","Kon’yugirlangan dienlarning qo‘shilish reaksiyalarida kinetik va termodinamik nazorat turli mahsulotlar berishi mumkin. Harorat va vaqt mahsulot nisbatiga ta’sir qiladi."],["Polimerlar","Butadien va izopren polimerlari sintetik va tabiiy kauchuklarning asosidir. Polimer xossasi mikrostruktura va qayta ishlash sharoitiga bog‘liq."]],f:["CH₂=CH–CH=CH₂ — 1,3-butadien","Kon’yugirlangan tizim: C=C–C=C"],ex:"1,3-butadienning π-elektronlari to‘rtta uglerod bo‘ylab delokallashishi mumkin; bu uning oddiy izolyatsiyalangan alkenlardan farqli reaktivligini tushuntiradi.",tasks:["Kon’yugirlangan va ajratilgan dienni farqlang.","Izopren polimerining amaliy ahamiyatini ayting."],q:[["Dien nechta qo‘sh bog‘ tutadi?",["1","2","3"],1,"Dien prefiksi ikkita qo‘sh bog‘ni bildiradi."],["Kon’yugirlangan ketma-ketlik?",["C=C–C=C","C–C–C–C","C≡C–C≡C"],0,"Qo‘sh va oddiy bog‘lar almashinadi."],["Delokallashish nimani anglatadi?",["Elektron zichligi bir necha atomga yoyiladi","Bog‘lar yo‘qoladi","Faqat ionlar hosil bo‘ladi"],0,"π-elektronlar bir necha atom bo‘ylab tarqaladi."]]},
{g:"II. Uglevodorodlar",t:"Alkinlar",d:1,intro:"Alkinlarda C≡C uch bog‘i mavjud. Uch bog‘ bitta σ va ikkita π-bog‘dan iborat; uglerodlar sp-gibridlangan va chiziqli geometriyaga ega.",s:[["Terminal alkin","–C≡C–H guruhidagi vodorod alkan vodorodidan kislotaliroq. Asetilid anionida manfiy zaryad sp-orbitalda, yadroga yaqinroq joylashadi."],["Olinishi","Dihalogenalkanlardan ketma-ket HX ajratish alkin olish usullaridan biri. Asetilen sanoatda turli texnologiyalar bilan olinadi."],["Reaksiyalar","Uch bog‘ga H₂, X₂, HX yoki suv qo‘shilishi mumkin. To‘liq gidrogenlash alkan beradi; selektiv qisman gidrogenlash alken berishi mumkin."]],f:["CₙH₂ₙ₋₂","HC≡CH + 2H₂ → CH₃–CH₃","HC≡CH + H₂O → CH₃CHO (gidratlanish va tautomerlanish)"],ex:"Asetilen gidratlanganda avval enol tipidagi shakl hosil bo‘lib, keyin tautomerlanib etanalga o‘tadi.",tasks:["Propinning to‘liq gidrogenlanish tenglamasini yozing.","Terminal alkin vodorodi nima uchun kislotaliroq?"],q:[["Uch bog‘ uglerodi gibridlanishi?",["sp","sp²","sp³"],0,"Uch bog‘ uglerodlari chiziqli va sp-gibridlangan."],["Terminal alkin guruhi?",["–C≡C–H","–OH","–COOH"],0,"Terminal alkin uch bog‘ oxirida vodorod tutadi."],["Asetilenning to‘liq gidrogenlanish mahsuloti?",["Etan","Eten","Etanol"],0,"Ikki H₂ ekvivalenti qo‘shilib alkan hosil qiladi."]]},
{g:"II. Uglevodorodlar",t:"Aromatik uglevodorodlar",d:1,intro:"Aromatik birikmalar uzluksiz kon’yugirlangan halqa bo‘ylab delokallashgan π-elektron tizimiga ega. Benzolda oltita C–C bog‘i ekvivalent va elektronlar halqa bo‘ylab delokallashgan.",s:[["Aromatiklik","Tekis, uzluksiz kon’yugirlangan halqa 4n+2 π-elektronga ega bo‘lsa Hückel mezoniga mos aromatik bo‘lishi mumkin."],["Elektrofil almashinish","Benzol nitrash, sulfolash va galogenlash kabi reaksiyalarga kirishadi. Katalizator elektrofil hosil bo‘lishiga yordam beradi va aromatiklik tiklanadi."],["O‘rinbosar ta’siri","Oldindan mavjud guruhlar keyingi almashinish tezligi va yo‘nalishini belgilaydi. Galogenlar deaktivator bo‘lsa ham odatda orto/para yo‘naltiradi."]],f:["Benzol: C₆H₆","C₆H₆ + HNO₃ —H₂SO₄→ C₆H₅NO₂ + H₂O","C₆H₆ + Br₂ —FeBr₃→ C₆H₅Br + HBr"],ex:"Benzol bromlanganda halqadagi H brom bilan almashinadi; alkenlardagi kabi oddiy qo‘shilish aromatiklikni yo‘qotgan bo‘lardi.",tasks:["Benzolning alkenlardan farqli reaksiyasini izohlang.","4n+2 qoidasi nimani anglatadi?"],q:[["Benzol formulasi?",["C₆H₆","C₆H₁₂","C₆H₁₄"],0,"Benzol C₆H₆ formulaga ega."],["Benzolning xarakterli reaksiyasi?",["Elektrofil aromatik almashinish","Faqat gidroliz","Faqat neytrallanish"],0,"Almashinish aromatik tizimni saqlashga imkon beradi."],["Bromlash katalizatori?",["FeBr₃","NaCl","NaOH"],0,"FeBr₃ Lewis kislotasi sifatida elektrofil hosil bo‘lishiga yordam beradi."]]},
{g:"III. Funksional guruhlar",t:"Galogenalkanlar: SN1, SN2 va eliminatsiya",d:1,intro:"Galogenalkanlarda C–X bog‘i qutbli. Nukleofil almashinish va eliminatsiya mexanizmlari substrat, nukleofil/asos, erituvchi va haroratga bog‘liq.",s:[["SN2","Bir bosqichda nukleofil hujumi va chiqib ketuvchi guruh ajralishi sodir bo‘ladi. Orqa tomondan hujum stereokimyoviy inversiya berishi mumkin."],["SN1","Ikki bosqichli mexanizmda karbokation oraliq zarrachasi hosil bo‘lishi mumkin. Substrat va erituvchi karbokation barqarorligiga ta’sir qiladi."],["E1/E2","Eliminatsiyada β-vodorod va chiqib ketuvchi guruh ajralib, alken hosil bo‘ladi. E2 bir bosqichli, E1 karbokation orqali boradi; almashinish bilan raqobatlashishi mumkin."]],f:["R–X + Nu⁻ → R–Nu + X⁻","Galogenalkan + asos → alken (eliminatsiya, sharoitga bog‘liq)"],ex:"Birlamchi galogenalkan ko‘pincha SN2 uchun qulayroq; uchlamchi substratda sterik to‘siq SN2 ni qiyinlashtiradi. Sharoit mahsulotni o‘zgartirishi mumkin.",tasks:["SN1 va SN2 ning ikki farqini yozing.","Eliminatsiyada qaysi bog‘lar uziladi?"],q:[["SN2 necha bosqichli?",["Bir","Ikki mustaqil","Uch"],0,"SN2 bir bosqichli mexanizmdir."],["SN1 da qanday oraliq hosil bo‘lishi mumkin?",["Karbokation","Faqat radikal","Neytron"],0,"SN1 da chiqib ketuvchi guruh ketishi karbokation berishi mumkin."],["Eliminatsiyaning mahsuloti ko‘pincha?",["Alken","Ester","Amid"],0,"β-H va chiqib ketuvchi guruh ajralib ko‘p bog‘ hosil qiladi."]]},
{g:"III. Funksional guruhlar",t:"Spirtlar va fenollar",d:1,intro:"Spirtlarda –OH alifatik uglerodga, fenollarda esa aromatik halqa uglerodiga bevosita bog‘langan. Bu tuzilish kislotalilik va reaksiyalarga ta’sir qiladi.",s:[["Vodorod bog‘i","Spirtlar orasidagi vodorod bog‘lari qaynash haroratini o‘xshash molyar massali alkanlarga nisbatan oshiradi."],["Oksidlanish","Birlamchi spirtlar sharoitga qarab aldegid yoki kislota, ikkilamchi spirtlar keton beradi. Uchlamchi spirtlarning odatiy oksidlanishi murakkabroq."],["Fenol","Fenol proton berganda hosil bo‘ladigan fenoksid anioni rezonans bilan barqarorlashadi; shu sabab fenol alifatik spirtlardan kislotaliroq."]],f:["R–OH + Na → R–ONa + ½H₂","Birlamchi spirt → aldegid → kislota (oksidlovchi sharoitga bog‘liq)","C₆H₅OH ⇌ C₆H₅O⁻ + H⁺"],ex:"Etanolning nazoratli oksidlanishi etanal berishi mumkin; kuchliroq oksidlovchi sharoitda etan kislota hosil bo‘lishi mumkin.",tasks:["Birlamchi va ikkilamchi spirt oksidlanishini taqqoslang.","Fenol nima uchun kislotaliroq?"],q:[["Spirt funksional guruhi?",["–OH","–CHO","–COOH"],0,"Spirt gidroksil guruhi tutadi."],["Ikkilamchi spirt oksidlanganda?",["Keton","Aldegid har doim","Alkan"],0,"Ikkilamchi spirt keton beradi."],["Fenol kislotaliligiga sabab?",["Fenoksid rezonansi","Faqat massa","Faqat rang"],0,"Fenoksid zaryadi rezonans bilan delokallashadi."]]},
{g:"III. Funksional guruhlar",t:"Oddiy va murakkab efirlar",d:1,intro:"Oddiy efirlar R–O–R′, murakkab efirlar R–COO–R′ tuzilishga ega. Esterlar karboksil kislota va spirt hosilalari bo‘lib, gidroliz va esterlanish reaksiyalariga kirishadi.",s:[["Oddiy efirlar","Kislorod ikki organik guruhni bog‘laydi. Oddiy efirlar vodorod bog‘ini donor sifatida bera olmaydi, lekin qabul qilishi mumkin."],["Esterlanish","Karboksil kislota va spirt kislota katalizida qaytar reaksiya bilan ester va suv berishi mumkin."],["Gidroliz","Ester suv bilan kislotali yoki asosli sharoitda parchalanadi. Ishqoriy gidrolizda karboksilat tuzi hosil bo‘ladi."]],f:["RCOOH + R′OH ⇌ RCOOR′ + H₂O (H⁺)","RCOOR′ + H₂O ⇌ RCOOH + R′OH"],ex:"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O — etil etanoat hosil bo‘lishining umumiy tenglamasi.",tasks:["Oddiy va murakkab efirni tuzilish bo‘yicha farqlang.","Ester gidrolizining mahsulotlarini yozing."],q:[["Oddiy efir ko‘rinishi?",["R–O–R′","R–COOH","R–CHO"],0,"Oddiy efirda O ikki organik guruhni bog‘laydi."],["Esterlanishda odatda nima ajraladi?",["Suv","Ammiak","Vodorod xlorid"],0,"Klassik esterlanishda suv hosil bo‘ladi."],["Ishqoriy gidrolizda nima hosil bo‘ladi?",["Karboksilat tuzi","Alkin","Benzol"],0,"Asosiy sharoitda karboksilat tuzi hosil bo‘ladi."]]},
{g:"III. Funksional guruhlar",t:"Aldegidlar va ketonlar",d:1,intro:"Aldegid va ketonlarda qutbli C=O karbonil guruhi mavjud. Aldegidda R–CHO, ketonda R–CO–R′ tuzilish bo‘ladi. Karbonil uglerodi nukleofillar uchun elektrofil markazdir.",s:[["Oksidlanish","Aldegidlar ko‘pincha karboksil kislotalargacha oksidlanadi; ketonlar yumshoq oksidlovchilarga nisbatan chidamliroq."],["Qaytarilish","Aldegid qaytarilganda birlamchi, keton qaytarilganda ikkilamchi spirt hosil bo‘ladi."],["Nukleofil qo‘shilish","Nukleofil karbonil uglerodiga hujum qiladi. Reagent va sharoitga qarab sianogidrin, imin yoki boshqa hosilalar olinishi mumkin."]],f:["R–CHO + [O] → R–COOH","R–CHO + 2[H] → R–CH₂OH","R–CO–R′ + 2[H] → R–CHOH–R′"],ex:"Propanon qaytarilganda propan-2-ol hosil bo‘ladi; karbonil guruhi spirt guruhiga aylanadi.",tasks:["Aldegid va ketonning tuzilish farqini yozing.","Etanal oksidlanganda qaysi kislota hosil bo‘ladi?"],q:[["Aldegid guruhi?",["R–CHO","R–CO–R′","R–O–R′"],0,"Aldegid karbonil uglerodiga H bog‘langan."],["Keton qaytarilganda?",["Ikkilamchi spirt","Karboksil kislota","Alkan"],0,"Keton qaytarilishi ikkilamchi spirt beradi."],["Karbonilning elektrofil markazi?",["Uglerod","Kislorod","Vodorod"],0,"C=O qutbliligi karbonil uglerodini elektrofil qiladi."]]},
{g:"III. Funksional guruhlar",t:"Karboksil kislotalar",d:1,intro:"Karboksil kislotalarda –COOH guruhi bor. Proton ajralganda karboksilat anionida manfiy zaryad ikki kislorod orasida rezonans bilan delokallashadi.",s:[["Kislotalilik","Elektron tortuvchi o‘rinbosarlar kislotalilikni oshirishi mumkin. Induktiv ta’sir bog‘lar bo‘ylab uzatiladi va masofa bilan kamayadi."],["Reaksiyalar","Asos bilan tuz va suv, spirt bilan ester, faol metall bilan tuz va vodorod hosil qilishi mumkin."],["Hosilalar","Kislota xlorangidridlari, angidridlar, esterlar va amidlar karboksil kislota hosilalaridir. Ular nukleofil atsil almashinish reaksiyalarida qatnashadi."]],f:["RCOOH + NaOH → RCOONa + H₂O","2RCOOH + 2Na → 2RCOONa + H₂"],ex:"CH₃COOH + NaOH → CH₃COONa + H₂O — etan kislotaning neytrallanishi.",tasks:["Karboksil kislota va spirt kislotaliligini taqqoslang.","Etan kislota va NaOH reaksiyasini yozing."],q:[["Karboksil guruhi?",["–COOH","–CHO","–NH₂"],0,"Karboksil guruh karbonil va gidroksil qismlaridan iborat."],["Asos bilan reaksiya mahsuloti?",["Tuz va suv","Alkin","Aldegid"],0,"Kislota-asos neytrallanishida tuz va suv hosil bo‘ladi."],["Karboksilatni nima barqarorlashtiradi?",["Rezonans","Faqat massa","Uch bog‘"],0,"Zaryad ikki kislorod bo‘ylab delokallashadi."]]},
{g:"III. Funksional guruhlar",t:"Aminlar",d:1,intro:"Aminlar ammiakdagi vodorodlarning organik guruhlar bilan almashgan hosilalari. Azotning erkin elektron jufti ularning asosligi va nukleofilligini belgilaydi.",s:[["Tasnif","RNH₂ birlamchi, R₂NH ikkilamchi, R₃N uchlamchi amin. Guruhlar alifatik yoki aromatik bo‘lishi mumkin."],["Asoslik","Aminlar proton qabul qilib ammoniy tuzlarini beradi. Aromatik aminlarda azot juftining rezonansga kirishishi asoslikni kamaytirishi mumkin."],["Reaksiyalar","Aminlar kislotalar bilan tuz hosil qiladi, alkillanish va atsilanish reaksiyalarida nukleofil sifatida qatnashadi."]],f:["RNH₂ + HCl → RNH₃⁺Cl⁻","R₂NH + H⁺ ⇌ R₂NH₂⁺"],ex:"Metilamin HCl bilan metilammoniy xlorid hosil qiladi; bu azotning proton qabul qilishini ko‘rsatadi.",tasks:["Birlamchi, ikkilamchi va uchlamchi aminlarni yozing.","Anilin asosligi nega pastroq bo‘lishi mumkin?"],q:[["Amin asosligi nimaga bog‘liq?",["Azotning erkin jufti","Faqat C–C bog‘i","Faqat rang"],0,"Azotning erkin elektron jufti protonni bog‘lay oladi."],["R₂NH qanday amin?",["Ikkilamchi","Birlamchi","Uchlamchi"],0,"Azotga ikki organik guruh ulangan."],["Amin + HCl mahsuloti?",["Ammoniy tuzi","Ester","Alken"],0,"Amin protonlanib ammoniy tuziga aylanadi."]]},
{g:"III. Funksional guruhlar",t:"Amidlar va nitrillar",d:1,intro:"Amidlarda karbonilga azot bog‘langan (R–CONH₂); nitrillarda –C≡N guruhi mavjud. Ikkalasi organik sintez va biologik molekulalarda muhim.",s:[["Amid rezonansi","Azotning erkin jufti karbonil bilan rezonansga kirishadi. Amid azotining asosligi aminlarga qaraganda ancha past."],["Nitril reaksiyalari","Nitrillar gidrolizlanganda sharoitga qarab amid oraliq mahsuloti orqali karboksil kislota beradi; qaytarilish birlamchi amin berishi mumkin."],["Sintezdagi roli","Nitril uglerodi yangi C–C bog‘lar qurish strategiyalarida qo‘llanadi. Peptid bog‘i kimyoviy jihatdan amid bog‘idir."]],f:["R–C≡N + 2H₂O → R–COOH + NH₃ (umumiy gidroliz)","R–CONH₂ — birlamchi amid"],ex:"Nitrilni to‘liq gidrolizlash mos karboksil kislotani beradi; oraliq bosqich va mahsulotning ionlanish holati sharoitga bog‘liq.",tasks:["Amid va aminning farqini yozing.","Nitril gidrolizining yakuniy mahsulot sinfini ayting."],q:[["Nitril guruhi?",["–C≡N","–OH","–COOH"],0,"Nitrilda C≡N uch bog‘i bor."],["Amid azotining asosligi nega past?",["Rezonans","Azot yo‘qligi","Faqat massasi"],0,"Erkin juft karbonil bilan delokallashadi."],["Nitril gidrolizining yakuniy mahsuloti?",["Karboksil kislota","Alkan","Efir"],0,"To‘liq gidroliz karboksil kislota beradi."]]},
{g:"IV. Biologik organik kimyo",t:"Aminokislotalar va oqsillar",d:1,intro:"Aminokislotalarda amin va karboksil guruhlari bor. α-aminokislotalar oqsillarning qurilish birliklari; suvda ko‘pincha zwitterion shaklida uchraydi.",s:[["Amfoterlik","Amin guruhi proton qabul qilishi, karboksil guruhi proton berishi mumkin. Izoelektrik nuqtada o‘rtacha sof zaryad nolga teng."],["Peptid bog‘i","Bir aminokislotaning karboksil va ikkinchisining amin guruhi orasida peptid bog‘i hosil bo‘ladi."],["Denaturatsiya","Harorat, pH yoki reagentlar oqsilning fazoviy tuzilishini buzishi mumkin; bu odatda birlamchi peptid ketma-ketligini to‘liq uzish degani emas."]],f:["H₂N–CH(R)–COOH","H₃N⁺–CH(R)–COO⁻ — zwitterion"],ex:"Glitsin R=H bo‘lgan eng sodda aminokislota. Uning zaryad holati muhit pH iga bog‘liq.",tasks:["Amfoterlikni tushuntiring.","Peptid bog‘i qaysi guruhlar orasida hosil bo‘ladi?"],q:[["Aminokislotalar nima sababdan amfoter?",["Amin va karboksil guruhlari bor","Metall tutadi","Faqat alkan"],0,"Ikki guruh proton qabul qilish/berish imkonini beradi."],["Peptid bog‘i qaysi guruhlar orasida?",["Amin va karboksil","Ikki alken","Ikki galogen"],0,"Peptid bog‘i aminokislotalarni ulaydi."],["Izoelektrik nuqtada sof zaryad?",["Nol","Faqat musbat","Faqat manfiy"],0,"Musbat va manfiy zaryadlar o‘rtacha tenglashadi."]]},
{g:"IV. Biologik organik kimyo",t:"Uglevodlar",d:1,intro:"Uglevodlar monosaxarid, disaxarid va polisaxaridlarga bo‘linadi. Ochiq zanjirli aldoza aldehidga, ketoza ketonga mos karbonil guruhiga ega; suvda halqali shakllar ham muhim.",s:[["Monosaxaridlar","Glyukoza va fruktoza monosaxaridlardir. Ular stereokimyoviy izomerlarga ega bo‘lishi mumkin."],["Glikozid bog‘i","Monosaxaridlar glikozid bog‘i orqali ulanadi. α/β konfiguratsiya va bog‘lanish pozitsiyasi polimer xossasiga ta’sir qiladi."],["Biologik vazifalar","Glyukoza energiya manbai; kraxmal o‘simlik zaxirasi; glikogen hayvon zaxirasi; sellyuloza o‘simlik hujayra devorining tarkibiy qismidir."]],f:["Glyukoza: C₆H₁₂O₆","Saxaroza + H₂O → glyukoza + fruktoza"],ex:"Kraxmal va sellyuloza glyukoza birliklaridan tuzilgan, lekin glikozid bog‘lari farqli; shu sabab vazifalari va hazm bo‘lishi ham farq qiladi.",tasks:["Kraxmal va sellyuloza vazifalarini taqqoslang.","Aldoza va ketoza farqini yozing."],q:[["Glyukoza formulasi?",["C₆H₁₂O₆","C₆H₆","C₂H₆O"],0,"Glyukoza olti uglerodli monosaxariddir."],["Hayvonlarda zaxira polisaxarid?",["Glikogen","Sellyuloza","Kraxmal"],0,"Glikogen hayvonlar zaxira uglevodidir."],["Aldoza va ketoza farqi?",["Karbonil turi","Uglerod bor-yo‘qligi","Faqat rang"],0,"Aldoza aldehidga, ketoza ketonga mos karbonil tutadi."]]},
{g:"IV. Biologik organik kimyo",t:"Lipidlar va yog‘lar",d:1,intro:"Lipidlar suvda yomon eriydigan yoki amfipatik biologik molekulalardir. Triatsilglitserollar energiya zaxirasi, fosfolipidlar esa membrana tarkibiy qismidir.",s:[["Yog‘ kislotalari","To‘yingan zanjirda C=C yo‘q; to‘yinmagan zanjirda qo‘sh bog‘lar bor. Cis qo‘sh bog‘ zanjirni bukib, qadoqlanishga ta’sir qiladi."],["Sovunlanish","Triatsilglitserol ishqor bilan gidrolizlanganda glitserin va yog‘ kislota tuzlari hosil bo‘ladi."],["Membrana","Fosfolipidlarning gidrofil boshi va gidrofob dumlari suvli muhitda ikki qavat hosil qiladi."]],f:["Triatsilglitserol + 3NaOH → glitserin + 3RCOONa"],ex:"Sovun molekulalarining gidrofob qismi yog‘li kirga, gidrofil qismi suvga moyil bo‘lib, yuvishni osonlashtiradi.",tasks:["To‘yingan va to‘yinmagan yog‘ni farqlang.","Fosfolipid nima uchun amfipatik?"],q:[["Sovunlanish mahsulotlari?",["Glitserin va yog‘ kislota tuzlari","Faqat alkan","Aldegid va amin"],0,"Ishqor esterlarni gidrolizlaydi."],["To‘yinmagan yog‘ belgisi?",["C=C","Faqat C–C","Faqat C≡N"],0,"To‘yinmagan zanjirda qo‘sh bog‘ mavjud."],["Fosfolipid amfipatikligi?",["Gidrofil bosh va gidrofob dum","Faqat suv","Faqat metall"],0,"Turli qismlar suvli muhitda ikki qavat hosil qilishga yordam beradi."]]},
{g:"IV. Biologik organik kimyo",t:"Geterotsiklik birikmalar",d:1,intro:"Geterotsiklik birikmalarda halqada ugleroddan tashqari N, O yoki S kabi atomlar bo‘ladi. Ular dori moddalar, vitaminlar va nuklein kislotalarda uchraydi.",s:[["Turlari","Furan va tiofen besh a’zoli, piridin olti a’zoli aromatik geterohalqalar misolidir."],["Elektron juft","Piridinda azotning erkin jufti aromatik π-sekstetga kirmaydi va proton qabul qilishi mumkin. Pirrolda erkin juft aromatik tizimga hissa qo‘shadi."],["Biologik ahamiyati","Purin va pirimidin halqalari DNK/RNK asoslarida uchraydi. Geterohalqa dori molekulasining bog‘lanishi va fizik-kimyoviy xossalariga ta’sir qiladi."]],f:["Piridin: C₅H₅N","Furan: C₄H₄O","Tiofen: C₄H₄S"],ex:"Piridin va pirrol ikkalasi azot tutadi, ammo erkin juftning aromatik tizimdagi roli farq qilgani uchun asosligi ham farqlanadi.",tasks:["Piridin va pirrolni taqqoslang.","Geterohalqalarning farmatsiyadagi roliga misol keltiring."],q:[["Geterohalqada nima bor?",["Ugleroddan boshqa halqa atomi","Faqat uglerod","Faqat metall"],0,"Geteroatom halqa skeletining bir qismidir."],["Piridinda erkin juft…",["Proton qabul qilishda qatnashadi","Mavjud emas","Har doim aromatiklikka kiradi"],0,"Piridin azotining jufti aromatik sekstetdan tashqarida."],["Purin/pirimidin qayerda uchraydi?",["DNK/RNK asoslarida","Faqat alkanlarda","Faqat yog‘larda"],0,"Nuklein kislota asoslari azotli geterohalqalar tutadi."]]},
{g:"V. Sintez va amaliy kimyo",t:"Polimerlar",d:1,intro:"Polimerlar ko‘p takrorlanuvchi monomer birliklardan tuzilgan yirik molekulalardir. Qo‘shilish polimerlanishida odatda kichik molekula ajralmaydi; polikondensatsiyada suv kabi kichik molekula ajralishi mumkin.",s:[["Zanjirli polimerlanish","Boshlanish, zanjir o‘sishi va tugash bosqichlari bo‘lishi mumkin. Radikal yoki ion mexanizmlari qo‘llanadi."],["Polikondensatsiya","Ko‘p funksional guruhli monomerlar bosqichma-bosqich birikib poliester yoki poliamid hosil qilishi mumkin."],["Xossalar","Molekulyar massa, tarmoqlanish, kristallik va o‘zaro bog‘lanish polimerning mexanik va termik xossalarini belgilaydi."]],f:["n CH₂=CH₂ → (–CH₂–CH₂–)ₙ","Diol + dikislota → poliester + kichik molekula"],ex:"Etenning C=C bog‘i ochilib, monomerlar orasida yangi C–C bog‘lar hosil bo‘ladi va polietilen zanjiri o‘sadi.",tasks:["Polimerlanish va polikondensatsiya farqi.","Termoplast va termosetga misol keltiring."],q:[["Eten polimerlanish mahsuloti?",["Polietilen","Poliamid","Sellyuloza"],0,"Eten qo‘shilish polimerlanishi bilan polietilen beradi."],["Polikondensatsiyada nima ajralishi mumkin?",["Kichik molekula","Faqat metall","Hech narsa hech qachon"],0,"Suv kabi kichik molekula ajralishi mumkin."],["Polimer xossasiga nima ta’sir qiladi?",["Tarmoqlanish va kristallik","Faqat nomi","Faqat rang"],0,"Tuzilish va morfologiya material xossalarini belgilaydi."]]},
{g:"V. Sintez va amaliy kimyo",t:"Spektral tahlil",d:1,intro:"IR, NMR va mass-spektrometriya organik moddaning funksional guruhlari, atom muhitlari va molekulyar massasini aniqlashga yordam beradi. Eng ishonchli xulosa bir nechta usulni birga talqin qilishdan olinadi.",s:[["IR","Molekula tebranishlari kuzatiladi; C=O, O–H, N–H va C≡N kabi bog‘lar xarakterli yutilish sohalariga ega."],["NMR","¹H va ¹³C NMR kimyoviy siljish, signallar soni, integrallash va ajralish orqali atom muhitlarini ko‘rsatadi."],["Mass-spektrometriya","Ionlarning m/z qiymati molekulyar massa va fragmentatsiya haqida ma’lumot beradi. Izotop naqshlari ayrim elementlarni aniqlashga yordam beradi."]],f:["NMR kimyoviy siljishi: δ, ppm","Mass-spektrometriya: m/z = massa / zaryad"],ex:"IR dagi karbonil signali va NMR dagi mos proton/uglerod signallari birga tahlil qilinsa, karbonil birikma tuzilishi haqida kuchliroq xulosa olinadi.",tasks:["IR va NMR farqini yozing.","m/z nimani anglatadi?"],q:[["IR nimani o‘lchaydi?",["Tebranish yutilishini","Faqat massa","Faqat bosim"],0,"IR spektr molekula tebranishlari bilan bog‘liq."],["NMR siljish birligi?",["ppm","kg","m/s"],0,"Kimyoviy siljish odatda ppm bilan ifodalanadi."],["m/z nimani bildiradi?",["Massa/zaryad nisbati","Molyar hajm","Bosim/harorat"],0,"m/z ion massasi va zaryad nisbatidir."]]},
{g:"V. Sintez va amaliy kimyo",t:"Organik sintez va retrosintez",d:1,intro:"Organik sintez maqsadli molekulani bosqichma-bosqich olishdir. Retrosintez maqsadli tuzilishdan orqaga qarab sodda boshlang‘ich moddalarga ajratishni rejalashtiradi.",s:[["Selektivlik","Chemoselektivlik funksional guruhni, regioselektivlik pozitsiyani, stereoselektivlik stereoisomerlarni afzal tanlashdir."],["Hosildorlik","Nazariy hosildorlik cheklovchi reagentdan hisoblanadi; amaliy hosildorlik yon reaksiyalar va yo‘qotishlar sabab pastroq bo‘lishi mumkin."],["Tozalash","Ekstraksiya, distillash, qayta kristallash va xromatografiya organik mahsulotlarni ajratish/tozalashda qo‘llanadi."]],f:["% hosildorlik = amaliy massa / nazariy massa × 100%"],ex:"Nazariy massa 10,0 g, amaliy massa 7,5 g bo‘lsa, hosildorlik 75% bo‘ladi.",tasks:["20 g nazariy mahsulotdan 15 g olinsa, hosildorlikni hisoblang.","Regio- va stereoselektivlikni farqlang."],q:[["Retrosintez qayerdan boshlanadi?",["Maqsadli molekuladan","Faqat erituvchidan","Faqat chiqindidan"],0,"Retrosintez maqsadli molekulani sodda prekursorlarga ajratadi."],["15 g amaliy, 20 g nazariy. Hosildorlik?",["75%","50%","25%"],0,"15/20 × 100 = 75%."],["Regioselektivlik nimani anglatadi?",["Bir pozitsiya mahsuloti afzal","Faqat rang","Faqat massa"],0,"Regioselektivlik bog‘lanish pozitsiyasini tanlashga taalluqli."]]},
{g:"V. Sintez va amaliy kimyo",t:"Laboratoriya xavfsizligi va yashil kimyo",d:1,intro:"Organik reagentlar yonuvchan, uchuvchan yoki toksik bo‘lishi mumkin. Xavfni kamaytirish uchun SDS bilan tanishish, tortma shkaf, mos himoya vositalari va chiqindilarni ajratish zarur.",s:[["Xavfni baholash","Reagentning toksikligi, yonuvchanligi, uchuvchanligi va boshqa moddalar bilan mos kelmasligi oldindan tekshiriladi."],["Himoya","Xalat, ko‘zoynak va mos qo‘lqop ishlatiladi. Zararli bug‘ chiqaruvchi ishlar tortma shkafda bajariladi. Noma’lum moddani hidlab tekshirish yoki og‘iz bilan pipetkalash mumkin emas."],["Yashil kimyo","Xavfli reagentlarni kamaytirish, atom iqtisodiyoti, energiya samaradorligi va chiqindini qisqartirishga intiladi."]],f:["Atom iqtisodiyoti (%) = mahsulotdagi kerakli atomlar massasi / reagentlardagi atomlar massasi × 100%"],ex:"Kamroq xavfli reagent va kam chiqindili yo‘l tanlash atrof-muhitga yukni kamaytirishi mumkin.",tasks:["SDS nima uchun kerak?","Atom iqtisodiyoti va hosildorlik farqini yozing."],q:[["SDS nima haqida ma’lumot beradi?",["Xavf va xavfsiz ishlatish","Faqat narx","Faqat rang"],0,"SDS xavf, saqlash, himoya va favqulodda choralarni bayon qiladi."],["Uchuvchan zararli erituvchi qayerda ishlatiladi?",["Tortma shkafda","Yopiq shamollatilmaydigan joyda","Yuzga yaqin"],0,"Tortma shkaf bug‘ ta’sirini kamaytiradi."],["Yashil kimyo maqsadi?",["Chiqindi va xavfni kamaytirish","Ko‘proq erituvchi","Himoyasiz ishlash"],0,"Yashil kimyo ekologik yukni va xavfni kamaytirishga intiladi."]]}
];
const outlines=[
["Organik reaksiyalar mexanizmi","σ/π bog‘ uzilishi, gomolitik/ geterolitik uzilish, karbokation, karbanion, radikal, nukleofil va elektrofil."],
["Alkanlarning radikal reaksiyalari","Zanjir boshlanishi, davom etishi, tugashi; galogenlash selektivligi; kreking va izomerlanish."],
["Alkenlar: oksidlanish va stereokimyo","Markovnikov yo‘nalishi, syn/anti qo‘shilish, dihidroksillanish, ozonoliz va polimerlanish."],
["Enollar, enolatlar va aldol reaksiyasi","Keto-enol tautomeriyasi, α-vodorodlar, enolat hosil bo‘lishi va C–C bog‘ hosil qilish."],
["Atsil birikmalar va nukleofil atsil almashinish","Kislota xlorangidridlari, angidridlar, esterlar va amidlar; chiqib ketuvchi guruh ta’siri."],
["Aromatik almashinish va yo‘naltirish","Faollashtiruvchi/deaktivator guruhlar, orto/para/meta yo‘naltirish va ko‘p o‘rinbosarlilik."],
["Organometall birikmalar","Grinyar va organolitiy reagentlari, C–C bog‘ sintezi, quruq sharoit talabi."],
["Aromatik geterohalqalar","Pirrol, furan, tiofen, piridin va diazinlarning elektron tuzilishi, asosligi va reaksiyalari."],
["Dori moddalar organik kimyosi","pKa, lipofillik, stereokimyo, funksional guruhlar va metabolik o‘zgarishlarga kirish."],
["Organik kimyoda hisoblash masalalari","Molyar massa, stexiometriya, cheklovchi reagent, nazariy hosildorlik va element tahlili."]
];
for(const [t,desc] of outlines)data.push({g:"VI. Kengaytirilgan kurs",t,d:0,intro:desc+" Ushbu bo‘limning to‘liq darsi quyidagi ketma-ketlikda o‘rganiladi: ta’rif va tuzilish, elektron mexanizm, reagent va sharoit, selektivlik, ishlangan misollar, mustaqil masalalar.",s:[["Asosiy tushuncha",desc],["O‘rganish tartibi","1) Asosiy atamalarni aniqlang. 2) Elektronlar harakati va bog‘lar o‘zgarishini chizing. 3) Reagent hamda sharoitni belgilang. 4) Mahsulot va ehtimoliy yon reaksiyalarni tahlil qiling."],["Mustahkamlash","Kamida ikkita reaksiya tenglamasini yozing va mahsulot nima sababdan hosil bo‘lishini tushuntiring."]],f:["Tahlil ketma-ketligi: substrat → reagent → sharoit → mahsulot → mexanizm"],ex:"Reaksiya tahlilini substratdagi funksional guruhni aniqlashdan boshlang; keyin reagentning nukleofil, elektrofil, asos yoki oksidlovchi/qaytaruvchi xususiyatini ko‘rib chiqing.",tasks:["Mavzuning uchta asosiy atamasini ta’riflang.","Bitta mexanizmni elektronlar harakati bilan izohlang."],q:[["Tahlil nimadan boshlanadi?",["Substrat va funksional guruhdan","Rangdan","Faqat massadan"],0,"Substratning tuzilishi ehtimoliy reaksiya yo‘lini belgilaydi."],["Mexanizm nimani ko‘rsatadi?",["Bog‘lar va elektronlar o‘zgarishini","Faqat rangni","Faqat massani"],0,"Mexanizm reaksiyaning bosqichlarini tushuntiradi."],["Faol o‘rganish usuli?",["Tenglama yozish va asoslash","Faqat sarlavha o‘qish","Javobni izohsiz yodlash"],0,"Mustaqil yechish tushunishni mustahkamlaydi."]]});
let idx=0,chosen={},done=new Set(JSON.parse(localStorage.getItem("org_done")||"[]")),scores=JSON.parse(localStorage.getItem("org_scores")||"{}");
const $=x=>document.getElementById(x), safe=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function visible(){let q=$("search").value.toLowerCase(),f=$("filter").value;return data.map((x,i)=>({...x,i})).filter(x=>(!q||(x.t+" "+x.g+" "+x.intro).toLowerCase().includes(q))&&(f==="all"||(f==="detail"?x.d===1:x.d===0)));}
function drawList(){let a=visible();$("list").innerHTML=a.map(x=>`<button class="topic ${x.i===idx?"active":""}" data-i="${x.i}">${safe(x.t)}<small>${safe(x.g)} ${done.has(x.i)?" · ✓":""}</small></button>`).join("");document.querySelectorAll(".topic").forEach(b=>b.onclick=()=>{idx=+b.dataset.i;drawList();drawLesson()});}
function drawLesson(){let x=data[idx];$("lesson").innerHTML=`<div class="eyebrow">${safe(x.g)} · ${x.d?"Batafsil dars":"Kengaytirilgan kurs rejasi"}</div><h2>${safe(x.t)}</h2><p>${safe(x.intro)}</p><h3>Nazariya</h3>${x.s.map(s=>`<h4>${safe(s[0])}</h4><p>${safe(s[1])}</p>`).join("")}<h3>Formulalar va tenglamalar</h3>${x.f.map(f=>`<div class="formula">${safe(f)}</div>`).join("")}<h3>Ishlangan misol</h3><div class="note">${safe(x.ex)}</div><h3>Mustaqil mashqlar</h3><ol>${x.tasks.map(t=>`<li>${safe(t)}</li>`).join("")}</ol><h3>Mavzuli test</h3><p class="muted">Javoblarni belgilang va testni tekshiring — har bir savol uchun izoh beriladi.</p>${x.q.map((q,i)=>`<div class="quizq"><b>${i+1}. ${safe(q[0])}</b>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}" ${chosen[idx+"-"+i]===j?"checked":""}> ${safe(a)}</label>`).join("")}<div id="fb${i}"></div></div>`).join("")}<div class="actions"><button class="primary" id="check">Testni tekshirish</button><button id="mark">Mavzuni o‘zlashtirdim ✓</button><button id="clear">Javoblarni tozalash</button></div><div id="result"></div>`;
x.q.forEach((q,i)=>document.querySelectorAll(`[name=q${i}]`).forEach(r=>r.onchange=()=>chosen[idx+"-"+i]=+r.value));
$("check").onclick=()=>{let n=0;x.q.forEach((q,i)=>{let a=chosen[idx+"-"+i],f=$("fb"+i);if(a===q[2]){n++;f.innerHTML=`<p class="good">To‘g‘ri.</p> ${safe(q[3])}`}else f.innerHTML=`<p class="bad">${a===undefined?"Javob tanlanmagan.":"Noto‘g‘ri."} To‘g‘ri javob: <b>${safe(q[1][q[2]])}</b>. ${safe(q[3])}`});let pct=Math.round(n/x.q.length*100);scores[idx]=Math.max(scores[idx]||0,pct);localStorage.setItem("org_scores",JSON.stringify(scores));$("result").innerHTML=`<h3>Natija: ${n}/${x.q.length} (${pct}%)</h3><p>${pct>=80?"A’lo!":pct>=60?"Yaxshi. Izohlarni qayta ko‘rib chiqing.":"Nazariyani qayta o‘qib, yana urinib ko‘ring."}</p>`;stats()};
$("mark").onclick=()=>{done.add(idx);localStorage.setItem("org_done",JSON.stringify([...done]));stats();drawList();$("result").innerHTML='<p class="good">Mavzu o‘zlashtirilganlar ro‘yxatiga qo‘shildi.</p>'};
$("clear").onclick=()=>{x.q.forEach((q,i)=>delete chosen[idx+"-"+i]);drawLesson()};
}
function stats(){let a=Object.values(scores);$("count").textContent=data.length;$("done").textContent=done.size;$("avg").textContent=(a.length?Math.round(a.reduce((s,v)=>s+v,0)/a.length):0)+"%";$("progress").style.width=(done.size/data.length*100)+"%"}
$("search").oninput=drawList;$("filter").onchange=drawList;$("reset").onclick=()=>{if(confirm("Barcha saqlangan test va o‘zlashtirish natijalari o‘chirilsinmi?")){done.clear();scores={};chosen={};localStorage.removeItem("org_done");localStorage.removeItem("org_scores");stats();drawList();drawLesson()}};stats();drawList();drawLesson();
</script></body></html>
